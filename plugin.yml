name: ChronoLifeNPC
main: com.horizon.chronolifenpc.Core
version: 1.0.0
api-version: 1.20
description: "Chrono Life inspired human-like NPC civilisation system"
authors: ["Turjo"]

commands:
  chrononpc:
    description: Manage ChronoLife NPCs
    usage: /chrononpc spawn|remove|list
  quest:
    description: Show active quest
    usage: /quest

permissions:
  chronolifenpc.manage:
    description: Manage ChronoLife NPCs
    default: op
